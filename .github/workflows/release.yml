name: Build and Release Windows App

on:
  push:
    tags:
      - "v*" # Runs when you push a version tag like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed main.py
        # --onefile = single exe
        # --windowed = no console window for GUI apps

      - name: Rename exe with tag
        run: |
          $tag="${{ github.ref_name }}"
          Rename-Item dist/main.exe "mfa-mealcards-$tag.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: dist/mfa-mealcards-${{ github.ref_name }}.exe

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/mfa-mealcards-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
